# Tamamo + nginx (auth_request mode)
#
# nginx keeps serving your site. For every request it asks Tamamo first:
#   204 -> let it through, 401 -> show the checking page, 403 -> show the denied page.
#
# Requires nginx built with ngx_http_auth_request_module (included in the
# official nginx packages and Docker images).
#
# Replace:
#   example.com            your host name(s); each one can be its own site in Tamamo
#   http://127.0.0.1:8923  where Tamamo listens
#   http://127.0.0.1:3000  your application (or use root/try_files for static sites)
#
# In Tamamo set Server -> Client IP source to "x-real-ip" and add nginx's
# address (127.0.0.1 here) to the trusted proxies.

upstream tamamo {
    server 127.0.0.1:8923;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com www.example.com;

    # Tamamo's own scripts, images and the verify endpoint.
    location /.tamamo/ {
        proxy_pass http://tamamo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only nginx itself may ask Tamamo for a verdict.
    location = /.tamamo/auth { return 404; }
    location = /.tamamo/forward-auth { return 404; }

    # Asked before every request. Internal: visitors can't call it directly.
    location = /.tamamo-auth {
        internal;
        proxy_pass http://tamamo/.tamamo/auth;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Renders the checking page (401) or the denied page (403).
    location @tamamo {
        proxy_pass http://tamamo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Tamamo-Render 1;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /.tamamo-auth;
        error_page 401 403 = @tamamo;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
